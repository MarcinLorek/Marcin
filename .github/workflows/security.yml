# Skanowanie bezpieczeństwa: CodeQL + Semgrep + gitleaks
# Uruchamia się przy każdym pushu, pull requeście i raz w tygodniu.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # poniedziałek 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Wykrywa, jakie języki są w repo, żeby CodeQL skanował tylko istniejący kod
  detect:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.langs.outputs.languages }}
    steps:
      - uses: actions/checkout@v7
      - id: langs
        run: |
          L=()
          has() { git ls-files | grep -Eq "$1"; }
          has '\.(kt|kts|java)$'                 && L+=('"java-kotlin"')
          has '\.(js|jsx|mjs|cjs|ts|tsx)$'       && L+=('"javascript-typescript"')
          has '\.py$'                            && L+=('"python"')
          has '\.(c|cc|cpp|h|hpp)$'              && L+=('"c-cpp"')
          has '\.cs$'                            && L+=('"csharp"')
          has '\.go$'                            && L+=('"go"')
          has '\.swift$'                         && L+=('"swift"')
          has '\.rb$'                            && L+=('"ruby"')
          has '^\.github/workflows/.*\.ya?ml$'   && L+=('"actions"')
          echo "languages=[$(IFS=,; echo "${L[*]}")]" >> "$GITHUB_OUTPUT"
          echo "Wykryte języki: [$(IFS=,; echo "${L[*]}")]"

  codeql:
    needs: detect
    if: needs.detect.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/default --config p/secrets --sarif --output semgrep.sarif --metrics=off
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # cała historia - sekrety w starych commitach też się liczą
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
