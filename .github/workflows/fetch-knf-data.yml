name: Codzienny snapshot rejestru KNF

on:
  schedule:
    # 18:30 UTC (19:30/20:30 czasu polskiego, w zależności od DST) w dni robocze,
    # po zakończeniu sesji GPW (17:00 czasu polskiego).
    - cron: "30 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności
        run: pip install -r backend/requirements.txt

      - name: Pobierz i sparsuj rejestr KNF
        run: python backend/fetch_knf.py

      - name: Commit i push zmian w danych
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "Brak zmian danych" && exit 0
          git commit -m "chore: codzienny snapshot rejestru KNF"
          git push
